name: Build

on:
  push:
    branches: [dev]
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'

      - name: Validate before publishing a release
        env:
          GOTOOLCHAIN: go1.27.3
          GOMAXPROCS: 4
        run: |
          bash .github/scripts/official-clients.sh "$RUNNER_TEMP/official"
          bash .github/scripts/validate-release.sh "$RUNNER_TEMP/official"

      - name: Pick the version
        id: version
        run: |
          VER=$(awk '/Version_[xyz] byte =/ {print $NF}' core/core.go | paste -sd.)
          LAST=$(git ls-remote --tags origin "refs/tags/v${VER}-dev.*" | grep -v '\^{}' | sed 's|.*-dev\.||' | sort -n | tail -n 1)
          echo "tag=v${VER}-dev.$((LAST + 1))" >> "$GITHUB_OUTPUT"

      - name: Build Xray
        env:
          CGO_ENABLED: 0
          GOOS: linux
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir dist
          BUILD="${TAG#*-}-$(git rev-parse --short HEAD)"
          for arch in amd64 arm64 armv7l; do
            goarch="$arch"
            if [ "$arch" = armv7l ]; then
              goarch=arm
            fi
            GOARCH="$goarch" GOARM=7 go build -o "dist/xray-linux-$arch" -trimpath -buildvcs=false -gcflags="all=-l=4" -ldflags="-X github.com/xtls/xray-core/core.build=${BUILD} -s -w -buildid=" -v ./main
          done
          cd dist && sha256sum xray-* > sha256sums.txt

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --latest --title "$TAG" \
            --notes "Validated shared Xray at ${GITHUB_SHA}; official-client interop and race checks passed before publication."
